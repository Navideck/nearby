name: nearby_example
description: "Demonstrates how to use the nearby plugin."
publish_to: 'none'

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  nearby:
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  universal_ble:
    git:
      url: https://github.com/Navideck/universal_ble.git

flutter:
  uses-material-design: true